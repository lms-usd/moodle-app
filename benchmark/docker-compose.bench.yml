services:
  # ==========================================
  # 1. FrankenPHP (Port 8081)
  # ==========================================
  bench-frankenphp:
    image: moodle-local:5.3
    container_name: bench-frankenphp
    ports:
      - "8081:8080"

  # ==========================================
  # 2. FastCGI: Nginx + PHP-FPM (Port 8082)
  # ==========================================
  bench-fpm:
    image: moodle-local:5.3-fpm
    container_name: bench-fpm
    volumes:
      - fpm-shared-html:/var/www/html

  bench-nginx:
    image: nginx:alpine
    container_name: bench-nginx
    ports:
      - "8082:8080"
    volumes:
      - fpm-shared-html:/var/www/html:ro
      - ./nginx-sidecar.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bench-fpm

  # ==========================================
  # 3. LOMP: OpenLiteSpeed + LSPHP (Port 8083)
  # ==========================================
  bench-lomp:
    image: moodle-local:5.3-lomp
    container_name: bench-lomp
    ports:
      - "8083:80"

volumes:
  fpm-shared-html:
