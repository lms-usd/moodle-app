name: Build, Unit Test, and Push Moodle 5.3 (FastCGI PHP-FPM)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/moodle-app

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # BUILD FOR TESTING (Do not push yet!)
      - name: Build candidate image for unit testing
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: moodle-candidate:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # RUN AUTOMATED CONTAINER UNIT TESTS
      # If any test in this script fails, the workflow halts here and NEVER pushes!
      - name: Run Container Unit & Hardening Tests
        run: |
          chmod +x tests/container-test.sh
          ./tests/container-test.sh moodle-candidate:test

      # LOGIN TO GITHUB CONTAINER REGISTRY (Only on merge to main, after tests pass)
      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # LOGIN TO DOCKER HUB (Only on merge to main, after tests pass)
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # GENERATE TAGS FOR BOTH GHCR AND DOCKER HUB
      - name: Extract metadata (tags, labels) for GHCR & Docker Hub
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=5.3,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=5.3-,format=short

      # PUSH VERIFIED IMAGE TO BOTH REGISTRIES (Uses cached layers from Step 1)
      - name: Push verified image to GHCR and Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
